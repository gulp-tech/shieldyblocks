name: Transfer experimental build evidence
on:
  push:
    paths:
      - .github/workflows/transfer-hypertnt-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download original build artifact
        uses: actions/download-artifact@v4
        with:
          name: HyperTNT-2.1.0-VISUAL-EXPERIMENTAL-TEST-ONLY
          run-id: 43744922837
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: extracted
      - name: Transfer the original JAR in annotated chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          p = Path('extracted/HyperTNT-2.1.0-VISUAL-EXPERIMENTAL.jar')
          data=p.read_bytes()
          assert hashlib.sha256(data).hexdigest()=='00bfedb0f461f192a7cb720a8d7cda805af517220ce21aaf66dfbb27099e85a3'
          text=base64.b64encode(data).decode('ascii')
          parts=[text[i:i+16000] for i in range(0,len(text),16000)]
          assert len(parts) <= 10, len(parts)
          for i,part in enumerate(parts): print(f'::notice title=jar-part-{i:02d}::{part}')
          PY
      - name: Fetch and transfer verification job logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/gulp-tech/shieldyblocks/actions/jobs/133319237616/logs > /tmp/verification-job.log
          python3 - <<'PY'
          import base64, re
          from pathlib import Path
          data=Path('/tmp/verification-job.log').read_text(encoding='utf8', errors='replace')
          # Avoid copying credential-like lines or signed links to the repository.
          data='\n'.join('[redacted credential-like line]' if re.search(r'(?i)(authorization:|github_pat_|gh[pousr]_|token=|sig=|password)', line) else line for line in data.splitlines())+'\n'
          text=base64.b64encode(data.encode()).decode('ascii')
          parts=[text[i:i+16000] for i in range(0,len(text),16000)]
          assert len(parts) <= 10, len(parts)
          for i,part in enumerate(parts): print(f'::notice title=log-part-{i:02d}::{part}')
          PY

name: Transfer experimental build evidence
on:
  push:
    paths:
      - .github/workflows/transfer-hypertnt-evidence.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download original build artifact
        uses: actions/download-artifact@v4
        with:
          name: HyperTNT-2.1.0-VISUAL-EXPERIMENTAL-TEST-ONLY
          run-id: 43744922837
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: extracted
      - name: Prepare transfer helper
        run: |
          cat > /tmp/transfer.py <<'PYCODE'
          import base64, hashlib, os
          from pathlib import Path
          data=Path('extracted/HyperTNT-2.1.0-VISUAL-EXPERIMENTAL.jar').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '00bfedb0f461f192a7cb720a8d7cda805af517220ce21aaf66dfbb27099e85a3'
          text=base64.b64encode(data).decode('ascii')
          parts=[text[i:i+3500] for i in range(0,len(text),3500)]
          start=int(os.environ['START'])
          assert len(parts) <= 36
          for i in range(start,min(start+9,len(parts))): print(f'::notice title=jar-part-{i:02d}::{parts[i]}')
          PYCODE
      - name: Transfer JAR chunks 0 to 8
        env:
          START: '0'
        run: python3 /tmp/transfer.py
      - name: Transfer JAR chunks 9 to 17
        env:
          START: '9'
        run: python3 /tmp/transfer.py
      - name: Transfer JAR chunks 18 to 26
        env:
          START: '18'
        run: python3 /tmp/transfer.py
      - name: Transfer JAR chunks 27 to 35
        env:
          START: '27'
        run: python3 /tmp/transfer.py
      - name: Try downloading original verification log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -L -sS -o /tmp/verification-job.log -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/gulp-tech/shieldyblocks/actions/jobs/133319237616/logs")
          echo "::notice title=Verification log HTTP status::$code"
          if [ "$code" = 200 ]; then
            python3 - <<'PYCODE'
          import base64, re
          from pathlib import Path
          data=Path('/tmp/verification-job.log').read_text(encoding='utf8', errors='replace')
          data='\n'.join('[redacted credential-like line]' if re.search(r'(?i)(authorization:|github_pat_|gh[pousr]_|token=|sig=|password)', line) else line for line in data.splitlines())+'\n'
          text=base64.b64encode(data.encode()).decode('ascii')
          parts=[text[i:i+3500] for i in range(0,len(text),3500)]
          if len(parts)>9:
              print(f'::notice title=Verification log transfer::too many parts: {len(parts)}')
          else:
              for i,part in enumerate(parts): print(f'::notice title=log-part-{i:02d}::{part}')
          PYCODE
          fi

name: HyperTNT 2.1 recovered source check
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/hypertnt-source-check.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: HyperTNT/pom.xml
      - name: Extract submitted source
        run: |
          git fetch origin main
          git show 1918325:HyperTNT-src.zip > /tmp/hypertnt-source.zip
          unzip -q /tmp/hypertnt-source.zip -d /tmp/hypertnt-source
          find /tmp/hypertnt-source -name pom.xml
      - name: Compile submitted HyperTNT 2.1 source
        run: mvn -B -f /tmp/hypertnt-source/HyperTNT/pom.xml clean package
      - name: Run self-contained registry tests
        run: |
          mkdir -p /tmp/hypertnt-test-classes
          javac -d /tmp/hypertnt-test-classes /tmp/hypertnt-source/HyperTNT/src/main/java/mk/hypertnt/TntRegistry.java /tmp/hypertnt-source/HyperTNT/src/testSelf/java/mk/hypertnt/TntRegistryTest.java
          java -ea -cp /tmp/hypertnt-test-classes mk.hypertnt.TntRegistryTest

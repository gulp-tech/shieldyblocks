name: Experimental HyperTNT visual adapter build
on:
  push:
    paths:
      - 'HyperTNT-2.1-experimental/**'
      - '.github/workflows/hypertnt-visual-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and run automated tests
        run: mvn -B -f HyperTNT-2.1-experimental/pom.xml clean package
      - name: Run registry self-test
        run: |
          mkdir -p /tmp/hypertnt-selftest
          javac -d /tmp/hypertnt-selftest HyperTNT-2.1-experimental/src/main/java/mk/hypertnt/TntRegistry.java HyperTNT-2.1-experimental/src/testSelf/java/mk/hypertnt/TntRegistryTest.java
          java -ea -cp /tmp/hypertnt-selftest mk.hypertnt.TntRegistryTest
      - name: Check packaged visual protocol using concurrency tests
        run: |
          mkdir -p /tmp/visual-selftest
          javac -d /tmp/visual-selftest HyperTNT-2.1-experimental/src/main/java/mk/hypertnt/visual/VisualFeed.java BedrockVisual-prototype/test/mk/hypertnt/visual/VisualFeedTest.java
          java -ea -cp /tmp/visual-selftest mk.hypertnt.visual.VisualFeedTest
      - uses: actions/upload-artifact@v4
        with:
          name: HyperTNT-2.1.0-VISUAL-EXPERIMENTAL-TEST-ONLY
          path: HyperTNT-2.1-experimental/target/HyperTNT-2.1.0-VISUAL-EXPERIMENTAL.jar
          if-no-files-found: error
          retention-days: 30

name: Build plugins
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build ShieldyBlocks
        working-directory: ShieldyBlocks
        run: |
          if ! bash gradlew build --no-daemon > /tmp/shieldy.log 2>&1; then
            python3 -c 'from pathlib import Path; t=Path("/tmp/shieldy.log").read_text(errors="replace")[-16000:]; print("::error::"+t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
      - name: Build and test HyperTNT
        working-directory: HyperTNT
        run: |
          if ! mvn -B clean verify > /tmp/hypertnt.log 2>&1; then
            python3 -c 'from pathlib import Path; t=Path("/tmp/hypertnt.log").read_text(errors="replace")[-16000:]; print("::error::"+t.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ShieldyBlocks
          path: ShieldyBlocks/build/libs/shieldyblocks-1.2.0.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HyperTNT
          path: HyperTNT/target/HyperTNT.jar
          if-no-files-found: error
  shield_first:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShieldyBlocks
      - name: Transfer part group 0
        run: |
          python3 - <<'PY'
          import base64, pathlib
          data = base64.b64encode(pathlib.Path('shieldyblocks-1.2.0.jar').read_bytes()).decode()
          chunks = [data[i:i+4000] for i in range(0, len(data), 4000)]
          if len(chunks) > 80: raise SystemExit('Jar too large to transfer')
          for i in range(0 * 10, min((0 + 1) * 10, len(chunks))):
              print(f'::notice title=JAR part {i:03d}::{chunks[i]}')
          PY
      - name: Transfer part group 1

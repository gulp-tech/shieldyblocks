name: Bedrock visual protocol prototype test
on:
  push:
    paths:
      - 'BedrockVisual-prototype/**'
      - '.github/workflows/visual-prototype-check.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and test in-memory protocol prototype
        run: |
          mkdir -p /tmp/visual-test
          javac -d /tmp/visual-test BedrockVisual-prototype/src/mk/hypertnt/visual/VisualFeed.java BedrockVisual-prototype/test/mk/hypertnt/visual/VisualFeedTest.java
          java -ea -cp /tmp/visual-test mk.hypertnt.visual.VisualFeedTest

name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        working-directory: ShieldyBlocks
        run: bash gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shieldyblocks-plugin
          path: ShieldyBlocks/build/libs/shieldyblocks-1.2.0.jar
          if-no-files-found: error

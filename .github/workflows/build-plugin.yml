name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        working-directory: ShieldyBlocks
        run: |
          if ! bash gradlew build --no-daemon > build.log 2>&1; then
            python3 -c 'from pathlib import Path; text = Path("build.log").read_text(errors="replace")[-16000:]; print("::error::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
      - name: Transfer jar part group 0
        working-directory: ShieldyBlocks
        run: |
          python3 - <<'PY'
          import base64, pathlib
          data = base64.b64encode(pathlib.Path('build/libs/shieldyblocks-1.2.0.jar').read_bytes()).decode()
          chunks = [data[i:i+4000] for i in range(0, len(data), 4000)]
          if len(chunks) > 80:
              raise SystemExit('Jar too large to transfer')
          for i in range(0 * 10, min((0 + 1) * 10, len(chunks))):
              print(f'::notice title=JAR part {i:03d}::{chunks[i]}')
          PY
      - name: Transfer jar part group 1
        working-directory: ShieldyBlocks
        run: |
          python3 - <<'PY'
